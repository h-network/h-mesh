# Brings up one h-mesh office (one pod/tenant) -- Redis, every h-mesh
# daemon, and every hired agent's tmux pane live inside it; reaching a
# different office means running a different container, not a flag on
# this one.
#
# Use ./setup.sh --container (or container/bootstrap.sh directly), not this
# file by hand -- it resolves each office to its own
# offices/<pod>/<tenant>/.env and always passes an explicit
# `-p h-mesh-<pod>-<tenant>` project name. Compose's own default project
# name is the containing folder's name ("container"), identical for every
# checkout regardless of pod/tenant -- two offices (or two checkouts of
# this repo) sharing a host WILL collide on that default and one `up`
# silently recreates the other's live office. Measured live, not
# theorized. If you drive this file directly anyway (advanced/testing),
# always pass your own `-p`:
#
#   docker compose -p h-mesh-<pod>-<tenant> -f container/compose.yaml \
#     --env-file offices/<pod>/<tenant>/.env up -d --build
#   docker compose -p h-mesh-<pod>-<tenant> -f container/compose.yaml \
#     --env-file offices/<pod>/<tenant>/.env down       # keeps the state volume
#   docker compose -p h-mesh-<pod>-<tenant> -f container/compose.yaml \
#     --env-file offices/<pod>/<tenant>/.env down -v    # also drops it
services:
  h-mesh:
    build:
      context: ..
      dockerfile: container/Dockerfile
    image: ${H_MESH_IMAGE:-h-mesh:latest}
    env_file:
      - ${H_MESH_TENANT_ENV_FILE:-.env}
    environment:
      POD: "${POD:-default}"
      TENANT: "${TENANT:-default}"
    ports:
      - "${API_PORT:-8080}:8080"
      - "${SESSION_PORT:-8081}:8081"
    volumes:
      # Redis's AOF, the tenant's persisted wizard config, and daemon
      # pidfiles/logs all live under $HOME/.h-mesh -- one volume, so a
      # container restart resumes the same registry/boards/message history
      # instead of a purged-transport, empty-roster restart.
      - h-mesh-state:/home/ubuntu/.h-mesh
      # claude/codex's own local state, notably session history --continue/
      # --resume reads (README's "conversation history that persists and
      # resumes across restarts") -- without this it lived only in the old
      # container's writable layer and was gone the moment `up` replaced it.
      # Separate from h-mesh's own state, so dropping one with `-v` doesn't
      # have to mean losing the other.
      # ⚠ Does NOT cover ~/.claude.json itself (a file directly in $HOME,
      # outside this directory) -- that's where onboarding/trust state
      # actually lives, and it comes from the image's own build-time seeding
      # (see Dockerfile) on every fresh container, not from this volume.
      - h-mesh-claude:/home/ubuntu/.claude
      - h-mesh-codex:/home/ubuntu/.codex
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      # The switch is the one daemon h-mesh cannot deliver without --
      # always-on regardless of which optional daemons this tenant enabled
      # (see services/daemons.py's own DAEMON_MODULES). Redis is checked
      # alongside it because a switch that's alive but has lost its
      # backing store is not a healthy tenant either.
      test: ["CMD-SHELL", "pgrep -f 'python.* -m core.service' >/dev/null && redis-cli -u redis://127.0.0.1:6379/0 ping >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  h-mesh-state:
    name: "${COMPOSE_PROJECT_NAME:-h-mesh}-state"
  h-mesh-claude:
    name: "${COMPOSE_PROJECT_NAME:-h-mesh}-claude"
  h-mesh-codex:
    name: "${COMPOSE_PROJECT_NAME:-h-mesh}-codex"
