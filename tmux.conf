# h-mesh default tmux.conf -- mouse mode, status bar, pane borders, sane
# quality-of-life bindings. Ships so a bare host (no container base image)
# gets the same UX the container image already bakes in. Installed by
# setup.sh / h-mesh upgrade (services.tmux_conf) as ~/.tmux.conf, unless one
# already exists.
#
# Reload after editing: tmux source-file ~/.tmux.conf

# --- Basics ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g focus-events on

# ============================================
# PREFIX: Ctrl+b
# ============================================
set -g prefix C-b
bind C-b send-prefix

# --- Pane Borders with Styled Titles ---
set -g pane-border-status top
set -g pane-border-format "#[fg=colour232,bg=colour240] #{pane_index} #[fg=colour232,bg=colour75,bold] #{pane_title} #[default]"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour75,bold"

# --- Status Bar ---
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=colour233,fg=colour248"

# Left: session name with icon
set -g status-left "#[fg=colour232,bg=colour75,bold]  #S #[fg=colour75,bg=colour238]#[fg=colour248,bg=colour238] #(whoami) #[fg=colour238,bg=colour233]"
set -g status-left-length 40

# Right: system info
set -g status-right "#[fg=colour238,bg=colour233]#[fg=colour248,bg=colour238] %a %d %b #[fg=colour75,bg=colour238]#[fg=colour232,bg=colour75,bold] %H:%M "
set -g status-right-length 50

# Window tabs
setw -g window-status-format "#[fg=colour248,bg=colour235] #I: #W "
setw -g window-status-current-format "#[fg=colour232,bg=colour75,bold] #I: #W "
setw -g window-status-separator ""

# --- Message & Command Styling ---
set -g message-style "fg=colour232,bg=colour75,bold"
set -g message-command-style "fg=colour75,bg=colour232"

# --- Quality of Life ---
set -g renumber-windows on
set -g escape-time 0
set -g display-time 2000
set -g display-panes-time 2000
#setw -g aggressive-resize on

# --- Splits (with current path) ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Pane Navigation (Alt+Arrow, no prefix) ---
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# --- Pane Resize (Ctrl+Arrow, no prefix) ---
bind -n C-Left resize-pane -L 2
bind -n C-Right resize-pane -R 2
bind -n C-Up resize-pane -U 2
bind -n C-Down resize-pane -D 2

# --- Quick Actions ---
bind . command-prompt -p "Pane title:" 'select-pane -T "%%"'
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
bind k kill-pane
bind K kill-session

# --- Pane Zoom Toggle ---
bind z resize-pane -Z

# --- Activity Monitoring ---
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style "fg=colour208"
