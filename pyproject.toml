[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "h-mesh"
version = "0.1.0"
description = "Host-installed message mesh for stateful agent offices"
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "claude-agent-sdk>=0.2,<1",
  "edge-tts>=6,<8",
  "fastapi>=0.115,<1",
  "openai-codex>=0.1,<1",
  "openshell>=0.0.116,<1",
  "redis>=5,<7",
  "uvicorn>=0.30,<1",
  "websockets>=13,<16",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
h-mesh = "modules.office.dispatcher:main"
h-mesh-api = "services.api:main"
h-mesh-claude-sdk-port = "modules.claude_sdk.port:main"
h-mesh-codex-sdk-port = "modules.codex_sdk.port:main"
h-mesh-openshell-port = "modules.openshell.port:main"
h-mesh-session = "services.session:main"
h-mesh-switch = "core.service:main"
h-mesh-tmux-port = "modules.tmux.port:main"
h-mesh-tmux-reconciler = "services.tmux_reconciler:main"
h-mesh-watchdog = "services.watchdog:main"
h-mesh-office = "modules.office.cli:main"
h-mesh-clone-to-all = "modules.office.cli:clone_to_all_entrypoint"
h-mesh-upgrade = "services.upgrade:main"
h-mesh-start = "services.daemons:main"

[tool.setuptools]
package-dir = {"" = "h-app"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["h-app"]
include = ["clients*", "core*", "lib*", "modules*", "services*", "tools*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["h-app"]
# Keep bare pytest authoritative as tests live both in h-app/tests and beside
# the web client. Explicit path arguments still narrow collection by design.
testpaths = ["h-app"]
