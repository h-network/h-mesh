name: Authoritative CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  authoritative-full-suite:
    name: Authoritative full suite
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reject unreviewed legacy-name references
        run: python h-app/tools/legacy_names.py
      - name: Install h-mesh
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --editable '.[test]'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify installed package and entry points outside the checkout
        run: |
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          python - <<'PY'
          from importlib.metadata import distribution

          import core.service
          import modules.api
          import modules.office.cli
          import modules.office.port
          import modules.openshell.port
          import modules.session.app
          import modules.tmux.port
          import services.api
          import services.session
          import services.tmux_reconciler
          import services.watchdog

          expected = {
              "h-mesh-api",
              "h-mesh-openshell-port",
              "h-mesh-session",
              "h-mesh-switch",
              "h-mesh-tmux-port",
              "h-mesh-tmux-reconciler",
              "h-mesh-watchdog",
              "h-mesh-office",
              "h-mesh-clone-to-all",
          }
          scripts = {
              entry.name: entry
              for entry in distribution("h-mesh").entry_points
              if entry.group == "console_scripts"
          }
          missing = expected - scripts.keys()
          if missing:
              raise SystemExit(f"missing console scripts: {sorted(missing)}")
          for name in expected:
              if not callable(scripts[name].load()):
                  raise SystemExit(f"{name} does not resolve to a callable")
          PY
          if h-mesh-tmux-port 2>tmux-port.stderr; then
            echo "h-mesh-tmux-port unexpectedly succeeded without an agent" >&2
            exit 1
          fi
          grep -F "usage: python -m modules.tmux.port <agent>" tmux-port.stderr
      - name: Run complete test suite
        run: python -m tools.run_tests
      - name: Switch smoke test (real Redis)
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
          POD: ci-smoke
          TENANT: ci-smoke
        run: python3 h-app/tools/smoke_switch.py
      - name: Delivery smoke test (real Redis)
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
          POD: ci-delivery
          TENANT: ci-delivery
        run: python3 h-app/tools/smoke_delivery.py
      - name: ACL denial smoke test (real Redis)
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
          POD: ci-acl-denial
          TENANT: ci-acl-denial
        run: python3 h-app/tools/smoke_acl_denial.py
      - name: Template port demo (real Redis)
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
          POD: ci-template
          TENANT: ci-template
        run: python3 h-app/tools/templates/demo_template_port.py
      - name: claude_sdk context-memory smoke test (real Redis)
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
          POD: ci-claude-sdk
          TENANT: ci-claude-sdk
        run: python3 h-app/tools/smoke_claude_sdk.py
      - name: Tmux port smoke test (real Redis and isolated tmux)
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
          POD: ci-tmux
          TENANT: ci-tmux
        run: python3 h-app/tools/smoke_tmux.py
      - name: Session smoke test (isolated tmux)
        run: python3 h-app/tools/smoke_session.py
